name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: heading-numerals-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          node-version: 24.18.0

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - name: Verify release source and version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"

      - name: Install locked dependencies
        run: npm ci

      - name: Run canonical release gates
        run: npm run release:check

      - name: Build deterministic release handoff
        run: node scripts/release-assets.mjs handoff "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"

      - name: Upload verified handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          compression-level: 0
          if-no-files-found: error
          name: heading-numerals-release-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: false
          path: ${{ runner.temp }}/release
          retention-days: 7

      - name: Attest public release assets
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/main.js
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/styles.css
            ${{ runner.temp }}/release/heading-numerals-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A Release already exists for $GITHUB_REF_NAME; publish a new version instead." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/main.js" \
            "$RUNNER_TEMP/release/manifest.json" \
            "$RUNNER_TEMP/release/styles.css" \
            "$RUNNER_TEMP/release/heading-numerals-$GITHUB_REF_NAME.zip" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag

      - name: Verify published bytes and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="heading-numerals-$GITHUB_REF_NAME.zip"
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              > "$RUNNER_TEMP/published-release.json" && \
              jq --exit-status --arg archive "$archive" '
                select(.immutable == true and .draft == false and .prerelease == false) |
                select(([.assets[].name] | sort) == ([$archive, "main.js", "manifest.json", "styles.css"] | sort)) |
                select(all(.assets[]; .state == "uploaded" and .size > 0 and (.digest | test("^sha256:[0-9a-f]{64}$")))) |
                .id
              ' "$RUNNER_TEMP/published-release.json" >/dev/null; then
              break
            fi
            test "$attempt" -lt 5
            sleep "$attempt"
          done
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
          expected=(main.js manifest.json styles.css "heading-numerals-$GITHUB_REF_NAME.zip")
          for name in "${expected[@]}"; do
            cmp --silent "$RUNNER_TEMP/release/$name" "$RUNNER_TEMP/published/$name"
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$RUNNER_TEMP/published/$name" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners; then
                break
              fi
              test "$attempt" -lt 5
              sleep "$attempt"
            done
          done
